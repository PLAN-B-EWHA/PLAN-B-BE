services:
  postgres:
    image: 'pgvector/pgvector:pg17'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    volumes:
      - './docker/postgres/init:/docker-entrypoint-initdb.d:ro'
    ports:
      - '5433:5432'
  redis:
    image: 'redis:latest'
    ports:
      - '6379:6379'
